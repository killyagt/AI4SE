[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-coding-agent-harness"
version = "0.1.0"
description = "A small, testable coding-agent harness with guardrails and feedback loops"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
credentials = ["keyring>=25"]
dev = ["pytest>=8"]

[project.scripts]
agent-harness = "agent_harness.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
